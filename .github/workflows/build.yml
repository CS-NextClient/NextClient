name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (vs2022, Release, x86)
    runs-on: windows-2022

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_bincache

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'custom-vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_bincache" | Out-Null

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Request the CMake file API codemodel
        shell: pwsh
        run: New-Item -ItemType File -Force -Path "build/vs2022/.cmake/api/v1/query/codemodel-v2" | Out-Null

      - name: Configure
        run: cmake --preset vs2022 "-DNEXTCLIENT_INSTALL_DIR=${{ github.workspace }}\install"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test goldsrc_abi tools
        run: python -m unittest discover -s nextclient/goldsrc_abi/tools -t nextclient/goldsrc_abi/tools -p "test_*.py"

      - name: Build
        run: cmake --build --preset vs2022-release --target BUILD_ALL

      # After the build: the gate resolves the includes of every compiled source, and the cmrc
      # sources of client_mini_rc and gui_app_core_rc are copied into place by a build rule.
      - name: Provenance gate
        run: python nextclient/goldsrc_abi/tools/provenance.py --build-dir build/vs2022 --config Release --allowlist .github/provenance-allowlist.json --report build/provenance-report.json

      - name: Upload provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-report-${{ github.sha }}
          path: build/provenance-report.json
          if-no-files-found: ignore

      # Separate configure directory: BUILD_ALL is only declared when NEXTCLIENT_BUILD_TESTS
      # is off, so the tests cannot share the build above.
      - name: Configure tests
        run: cmake --preset vs2022-tests "-DNEXTCLIENT_INSTALL_DIR=${{ github.workspace }}\install-tests"

      - name: Build tests
        run: cmake --build --preset vs2022-tests-release --target client_mini-tests

      - name: Run tests
        run: ctest --test-dir build/vs2022-tests -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextClient-${{ github.sha }}
          path: install/
          if-no-files-found: error

      - name: Upload PDBs
        uses: actions/upload-artifact@v4
        with:
          name: NextClient-pdb-${{ github.sha }}
          path: out/pdb/Release/*.pdb
          if-no-files-found: error
